# Example: Anthropic Messages API via the anthropic_sdk backend.
# claude_code drives the native /v1/messages endpoint with adaptive
# extended thinking at "high" effort, reading its token from CAPI_TOKEN.

seclab-taskflow-agent:
  version: "1.0"
  filetype: model_config
models:
  claude_code: claude-opus-4.7
model_settings:
  claude_code:
    api_type: messages
    backend: anthropic_sdk
    reasoning:
      effort: high
