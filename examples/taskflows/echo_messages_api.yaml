# Echo taskflow using the Anthropic Messages API (anthropic_sdk backend).

seclab-taskflow-agent:
  version: "1.0"
  filetype: taskflow

model_config: examples.model_configs.messages_api

taskflow:
  - task:
      max_steps: 5
      must_complete: true
      agents:
        - examples.personalities.echo
      model: claude_code
      user_prompt: |
        Hello from the Anthropic Messages API
